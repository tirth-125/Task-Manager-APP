<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .forgot-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #email {
            height: 40px;
            width: 300px;
            border-radius: 5px;
            margin-bottom: 15px;
            padding: 0 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        #submitButton {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #submitButton:hover {
            background-color: #0056b3;
        }

        #forgotPasswordLink {
            margin-top: 20px;
            font-size: 14px;
            text-decoration: none;
            color: #007bff;
        }

        #forgotPasswordLink:hover {
            text-decoration: underline;
        }

        #registerLink {
            margin-top: 20px;
            font-size: 14px;
            text-decoration: none;
            color: #007bff;
        }

        #registerLink:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="forgot-form">
        <h2>Forgot Password</h2>
        <form id="forgotPasswordForm">
            <input type="email" name="email" id="email" placeholder="Enter Your Email">
            <button type="submit" id="submitButton">Forgot Password</button>
        </form>
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        <a href="#" id="registerLink">Register</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Retrieve the form element
            const form = document.getElementById('forgotPasswordForm');
            // Check if the form element exists
            if (form) {
                // Add submit event listener to the form
                form.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    const email = document.getElementById('email').value;
                    try {
                        const response = await axios.post("http://127.0.0.1:5000/api/v1/auth/forgotPassword", {
                            email: email
                        });
                        console.log(response.data); // Log the response from the server
                        alert("Password reset link sent successfully!"); // Display a success message to the user
                    } catch (error) {
                        console.error(error); // Log any errors that occur during the request
                        alert("Error occurred. Please try again."); // Display an error message to the user
                    }
                });
            } else {
                console.error("Form element with id 'forgotPasswordForm' not found.");
            }
        });
    </script>
</body>

</html>
