<!-- resetpassword.html -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            display: block;
            text-align: center;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Reset Password</h2>
        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your new password" required>
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required>
            </div>
            <button class="btn" type="submit">Reset Password</button>
            <div id="error" class="error"></div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('resetPasswordForm');
            if (form) {
                form.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    console.log("a");

                    const passwordInput = document.getElementById('password');
                    console.log("b");

                    const confirmPasswordInput = document.getElementById('confirmPassword');
                    console.log("c");

                    if (!passwordInput || !confirmPasswordInput) {
                        console.error("Password inputs not found.");
                        return;
                    }
                    const password = passwordInput.value;
                   
                    const confirmPassword = confirmPasswordInput.value;
                    
                    const currentUrl = window.location.href;
                    console.log(new URLSearchParams(new URL(currentUrl).search).get('token'),"ddsdsd");
                    const params = new URLSearchParams(new URL(currentUrl).search);
                    // console.log(params,"asasasa");
                    const token = params.get('token');
                    // console.log(token);
                    if (password !== confirmPassword) {
                        alert("Passwords do not match!");
                        return;
                    }

                    try {
                        const response = await axios.post(`http://127.0.0.1:5000/api/v1/auth/resetPassword/${token}`, {
                            password: password
                        });
                        alert("Password reset successful!");
                    } catch (error) {
                        console.error(error);
                        alert("Error resetting password. Please try again.");
                    }
                });
            } else {
                console.error("Form element with id 'resetPasswordForm' not found.");
            }
        });
    </script>
</body>

</html>
